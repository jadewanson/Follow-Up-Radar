name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: followup_radar
          POSTGRES_USER: followup
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U followup -d followup_radar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-only-secret
      APP_BASE_URL: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://followup:ci-password@127.0.0.1:5432/followup_radar
      REDIS_URL: redis://127.0.0.1:6379/0
      EMAIL_DELIVERY_MODE: dev_file
      EMAIL_FROM_ADDRESS: noreply@followup-radar.local
      DEV_EMAIL_OUTBOX_PATH: /tmp/followup-radar-ci-outbox.jsonl
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SUPPORT_EMAIL_ADDRESS: support@followup-radar.local
      BETA_TRIAL_DAYS: "14"
      PRO_MONTHLY_PRICE_USD: "9"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: ruff check app --select E4,E7,E9,F
      - name: PostgreSQL migration smoke test
        run: alembic upgrade head
      - name: Backend tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check extension JavaScript syntax
        working-directory: extension
        run: |
          node --check background.js
          node --check popup/popup.js
